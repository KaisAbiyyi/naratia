name: CI

on:
  pull_request:
  push:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dua nilai pertama bersifat publik (juga dikirim ke setiap browser), aman ada di repo.
      PUBLIC_SUPABASE_URL: https://mpufaqbuirilrhrhbcmo.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_eDQTp1NmiCkojM13lGLsCg_3MUREyAx
      # Rahasia. Kosong di PR dari fork atau kalau belum diisi: test yang butuh login dilewati.
      DEV_TEST_PASSWORD: ${{ secrets.DEV_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Unit test
        run: pnpm run test:unit --run

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (build + Playwright)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
